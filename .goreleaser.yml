version: 2

builds:
  - id: terraform-provider-proxmox
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    binary: "terraform-provider-proxmox_v{{ .Version }}"
archives:
  - formats: [ zip ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  # Publish as a draft.  The tag build still runs unattended and uploads every
  # signed artifact, but the release stays invisible until a human presses
  # Publish in the web UI.
  #
  # That gate matters here because a published release is what the OpenTofu
  # registry picks up, and a version cannot be unpublished once consumers have
  # resolved it -- only superseded.  A draft leaves room to check the assets,
  # the checksums and the notes first, and to delete the whole thing silently
  # if the tag was wrong.
  draft: true
  # Re-running a tag build replaces the draft rather than leaving two behind.
  # Only safe because the release is a draft: it never touches something the
  # registry has already served.
  replace_existing_draft: true

changelog:
  sort: asc
  filters:
    exclude:
      # Merge commits are noise in a release note; the PR's own commits are
      # already listed individually.
      - "^Merge "
      # Conventional-commit prefixes.  Nothing in this fork uses them yet --
      # upstream did -- so these are inert today and there for backports and
      # for whenever the fork adopts the convention.
      - "^docs:"
      - "^test:"
      - "^chore:"
