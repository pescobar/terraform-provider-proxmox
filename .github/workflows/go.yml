name: Go

on:
  # Runnable on any branch, so a branch that is not yet the default one can
  # still be built and tested.
  workflow_dispatch:

  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'

  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'

env:
  GO_VERSION: '1.21'

permissions:
  contents: read

jobs:
  verify-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The Makefile derives versions from `git describe --tags`; without
          # tags it evaluates $((<sha>+1)) and bash prints
          # "value too great for base".
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Verify dependencies
        run: go mod verify

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The Makefile derives versions from `git describe --tags`; without
          # tags it evaluates $((<sha>+1)) and bash prints
          # "value too great for base".
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build
        run: make build

  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The Makefile derives versions from `git describe --tags`; without
          # tags it evaluates $((<sha>+1)) and bash prints
          # "value too great for base".
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Run go vet
        run: make vet

  staticcheck:
    runs-on: ubuntu-latest
    # Non-blocking: this baseline carries 23 pre-existing SA1019 findings, all
    # of them the deprecated non-Context CRUD fields (Create vs CreateContext).
    # Fixing them changes cancellation behaviour, so it is not a drop-in-safe
    # change and does not belong in the version that has to match production
    # byte for byte. Tracked in CLAUDE.md.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The Makefile derives versions from `git describe --tags`; without
          # tags it evaluates $((<sha>+1)) and bash prints
          # "value too great for base".
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run staticcheck
        run: staticcheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The Makefile derives versions from `git describe --tags`; without
          # tags it evaluates $((<sha>+1)) and bash prints
          # "value too great for base".
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Run tests
        run: make test
